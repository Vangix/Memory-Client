name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
      - name: Build
        run: gradle build
        continue-on-error: true
      - name: API dump
        if: always()
        run: |
          CP=$(find ~/.gradle -name "*.jar" -size +1M | tr '\n' ':')
          {
            echo "=== Big jars"
            find ~/.gradle -name "*.jar" -size +1M | head -30

            echo "=== Minecraft classes (gui/renderer top level)"
            for j in $(find ~/.gradle -name "*.jar" -size +1M); do
              jar tf "$j" 2>/dev/null | grep -E "^net/minecraft/client/(gui|renderer)/[^/$]*\.class$" | grep -E "Graphics|Extract|Buffer|RenderType|Collector|Gizmo|Line|RenderState|Pipeline"
            done | sort -u | head -150

            echo "=== Fabric API nested modules"
            rm -rf /tmp/fa && mkdir -p /tmp/fa
            for j in $(find ~/.gradle -name "fabric-api-*.jar" ! -name "*sources*" ! -name "*javadoc*"); do
              (cd /tmp/fa && jar xf "$j" META-INF/jars)
            done
            ls /tmp/fa/META-INF/jars 2>/dev/null | head -80
            echo "=== Fabric API classes"
            for n in /tmp/fa/META-INF/jars/*.jar; do
              jar tf "$n" 2>/dev/null | grep -E "api/client/(rendering|keymapping|keybinding|event/lifecycle)/[^/]*\.class$" | grep -v '\$'
            done | sort -u | head -120

            echo "=== KeyMapping Category"
            javap -cp "$CP" 'net.minecraft.client.KeyMapping$Category' 2>&1 | head -30
            echo "=== Screen"
            javap -cp "$CP" net.minecraft.client.gui.screens.Screen 2>&1 | grep -E "render|extract|mouse|key|Screen\(|isPauseScreen|font" | head -40
            echo "=== Font"
            javap -cp "$CP" net.minecraft.client.gui.Font 2>&1 | grep -E "width|draw|String" | head -20
          } > api-dump.txt 2>&1
          cat api-dump.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-dump
          path: api-dump.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mod-jar
          path: build/libs/*.jar
